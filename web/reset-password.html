<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your password</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Set your password</h1>
      <p class="muted" id="msg">Choose a password with at least 8 characters.</p>
      <form id="form" hidden>
        <label class="field"><span class="field-label">New password</span><input id="p1" type="password" autocomplete="new-password" minlength="8" required></label>
        <label class="field"><span class="field-label">Type it again</span><input id="p2" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn btn-primary" style="width:100%" type="submit">Save password</button>
      </form>
    </div>
  </div>
  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
